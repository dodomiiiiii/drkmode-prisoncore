# =========================================================
#  Crates. Place one with /crate set <id> while looking at a block (chest, ender chest...).
#  Right-click with key = open | Shift + right-click = open all keys in hand | Left-click = preview + filter
#  Players click a reward in the preview (or /cratefilter) to auto-delete it whenever they win it.
#
#  Reward options:
#    chance: weight (doesn't have to add up to 100)
#    item: {material, amount, name, lore}  - icon shown in the GUI
#    give-item: true  - also give that item
#    money / tokens   - added directly
#    commands         - run from console, %player% is replaced
#    broadcast: true  - announce in chat
#  Optional per crate: effects: {style: helix, particle, particle-2, item, item-height, item-scale, animate-hologram}
#  Register a crate block from console: /crate setat <crate> <world> <x> <y> <z>
# =========================================================

# Rewards with scale-tokens: true are multiplied by (1 + per-rank x rank) x (1 + per-prestige x prestige),
# and money-rankup gives that fraction of your next rankup/prestige cost - so crates stay worth opening.
token-scaling:
  per-rank: 0.15
  per-prestige: 0.5

# Which keys Key Finder gives (weights)
key-finder:
  common: 70
  rare: 25
  legendary: 5

