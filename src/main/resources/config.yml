# =========================================================
#  PrisonCore - main config
#  Colors/formatting use MiniMessage: https://docs.advntr.dev/minimessage/format.html
# =========================================================

# Don't touch: used to update this file automatically on new versions.
config-version: 25

# Players keep their items and XP when they die.
keep-inventory: true

starting-money: 0
starting-tokens: 0
autosave-minutes: 2

pickaxe:
  # Give a prison pickaxe on join/respawn to anyone who doesn't have one in their inventory.
  give-if-missing: true
  prevent-drop: true

mines:
  # Block players (without prisoncore.build) from breaking/placing outside mines.
  protect-outside-mines: true
  # Worlds where that protection applies. Empty list = every world.
  protected-worlds: []
  # How many blocks are refilled per tick during a reset (lower = smoother, slower).
  # Build the bedrock box (walls + floor, 1-block air gap) automatically on /mine create.
  # It replaces whatever is in that space. Rebuild any time with /mine shell <mine>.
  auto-shell: true
  blocks-per-tick: 30000
  # Blocks placed per tick while /pa setupmines builds the mine plots.
  paste-blocks-per-tick: 20000
  # Where players inside a mine go when it resets:
  #   top   = lifted straight up onto the top of the mine (same spot)
  #   spawn = the mine's spawn point (/mine setspawn)
  reset-teleport: top
  menu-title: "<dark_gray>Mines"

# Warning while mining with a full Ore Bag: action bar + sound every 2s, a big title every title-seconds.
bag-full-alert:
  enabled: true
  title-seconds: 30

autosell:
  # New players start with autosell on/off (needs prisoncore.autosell to use).
  default-enabled: true
  # Autosell sells the bag + inventory once every this many minutes (one clock for everyone).
  # Between sales everything has to fit in the ore bag, so bag upgrades matter. 0 = sell every block instantly (old way).
  interval-minutes: 15
  # Every prestige takes this many minutes off the timer, never going below min-minutes.
  # 0.5 -> P1 14m30s, P10 10m, P20 5m
  minus-per-prestige: 0.5
  min-minutes: 5
  # Paid ranks shave more minutes off, but autosell is never faster than this.
  donor-floor-minutes: 1
  # Only used when interval-minutes is 0: sell what doesn't fit instead of losing it.
  sell-when-inventory-full: false

tokens:
  # Chance (%) to earn tokens for each block mined (no enchant needed). 50 = about 1 token every 2 blocks.
  per-block-chance: 50
  per-block-amount: 25
  # Tokens per block broken by Explosive / Jackhammer.
  per-proc-block: 0.5

# Extra sell multiplier from permissions: prisoncore.multiplier.<name>
# Only the highest one applies. 0.25 = +25%
permission-multipliers:
  spark: 0.10
  ion: 0.20
  nova: 0.35
  pulsar: 0.50
  quasar: 0.75
  nebula: 1.00
  singularity: 1.50

# Vault: other plugins (shops, auctions, jobs...) use PrisonCore money automatically
# when Vault is installed. These only change how they display it.
vault:
  currency-symbol: "$"
  currency-singular: "Dollar"
  currency-plural: "Dollars"

# Top lists for %prisoncore_top_...% placeholders (holograms, tab). Rebuilt every X minutes.
leaderboards:
  update-minutes: 5
  # Big leaderboard walls (text displays). yaw -90 = text faces east. scale = text size.
  displays:
    money:    {board: money,    title: "<aqua><b>TOP MONEY",         world: spawn, x: -49.9, y: 103.6, z: -8.5, yaw: -90, scale: 1.45}
    prestige: {board: prestige, title: "<light_purple><b>TOP PRESTIGE", world: spawn, x: -49.9, y: 103.6, z: 0.5,  yaw: -90, scale: 1.45}
    blocks:   {board: blocks,   title: "<yellow><b>TOP BLOCKS MINED", world: spawn, x: -49.9, y: 103.6, z: 9.5,  yaw: -90, scale: 1.45}

crates:
  # world = rewards orbit the crate and the prize pops out above it (everyone sees it); gui = spinning menu
  animation-style: world
  hologram-height: 1.6
  mass-open-max: 64

chat:
  # {title} = donor rank / clearance / chosen title (/prefix), {name} = name color + nickname, {suffix} = /suffix.
  # Turn off if you use a chat plugin.
  enabled: true
  format: "{title}{prestige}{rank} {name}{suffix}<dark_gray> » "

scoreboard:
  enabled: true
  update-ticks: 20
  title: "<gradient:#ffd166:#ef476f><b>  PRISON  </b></gradient>"
  # Placeholders: {player} {rank} {rank_prefix} {next_rank} {prestige} {money} {tokens} {blocks}
  # {multiplier} {rankup_cost} {progress} {progress_bar} {mine} {mine_reset} {online} {bag} {autosell}  (max 15 lines)
  lines:
    - "<gold><b>Player"
    - " <gray>Rank: {rank_prefix}"
    - " <gray>Prestige: <light_purple>{prestige}"
    - " <gray>Multiplier: <aqua>x{multiplier}"
    - ""
    - "<gold><b>Economy"
    - " <gray>Money: <green>${money}"
    - " <gray>Tokens: <yellow>{tokens}"
    - " <gray>Cores: <#3ab8ff>◉ <#7fd8ff>{cores}"
    - " <gray>Blocks: <white>{blocks}"
    - " <gray>Bag: <white>{bag} <dark_gray>⟳<white>{autosell}"
    - " "
    - "<gold><b>Rankup <gray>({next_rank})"
    - " {progress_bar} <white>{progress}%"
    - "<dark_gray><st>                    </st>"

