# /gems: gem slots unlock with prestige; gems give a stat when socketed; 2 identical gems fuse into +1 level.
gems:
  enabled: true
  title: "<dark_gray>Gems"
  max-level: 14
  # stat value = max x (level / max-level) ^ curve   (+1 is small, +14 = max)
  curve: 1.6
  # prestige needed for each slot
  slots: [10, 13, 16, 20, 25]
  # % chance to fuse +1->+2, +2->+3 ... +13->+14. A failed fusion destroys one of the two gems.
  fuse-chances: [100, 95, 90, 85, 78, 70, 62, 54, 46, 38, 30, 22, 15]
  broadcast-from: 10
  glint-from: 5
  drop:
    min-prestige: 10
    chance-per-block: 0.005   # % per mined block (not Jackhammer/Explosive layers) -> 1 in 20,000
    plus2-chance: 10          # % of drops that are +2
    plus3-chance: 2           # % of drops that are +3
  # stat: sell (money multiplier, +x), fortune (drops), token-gain, key-finder, proc-chance (Jackhammer/Explosive)
  types:
    abundance: {name: "<gradient:#7dff8a:#2ecc71><b>Abundance Gem</b></gradient>", icon: EMERALD, stat: sell, max: 2.0, description: "Raises your money multiplier."}
    prospect:  {name: "<gradient:#7afcff:#3a8bff><b>Prospect Gem</b></gradient>", icon: DIAMOND, stat: fortune, max: 1.0, description: "More drops from every block."}
    flux:      {name: "<gradient:#ffe066:#ffb347><b>Flux Gem</b></gradient>", icon: GOLD_NUGGET, stat: token-gain, max: 1.0, description: "More tokens from mining."}
    fate:      {name: "<gradient:#ff7af5:#b36bff><b>Fate Gem</b></gradient>", icon: AMETHYST_SHARD, stat: key-finder, max: 0.5, description: "Find crate keys more often."}
    surge:     {name: "<gradient:#ff6b6b:#ff3b3b><b>Surge Gem</b></gradient>", icon: REDSTONE, stat: proc-chance, max: 0.5, description: "Jackhammer & Explosive trigger more."}

