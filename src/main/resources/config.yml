# Admin setup: mv create cells normal -g VoidGen, then /cell build (creates the block and /warp cells).
cells:
  enabled: true
  world: cells
  base-y: 100
  floors: 2
  cells-per-side: 16
  # one-time price, the cell is yours until you're offline for inactive-days
  price: 1000000000000
  inactive-days: 30

