# /store (ranks + items for Cores). rank-command gives the rank; %rank% = the donor-ranks id (= LuckPerms group).
store:
  title: "<dark_gray>Colony Store"
  rank-command: "lp user %player% parent add %rank%"
  buy-cores-hint: "Get Cores at our webstore."

