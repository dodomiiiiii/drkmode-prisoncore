# Shown to a player the very first time they join.
# New player tutorial (starts on first join, /tutorial replays): navigator -> pmine -> mine -> bag -> sell -> rankup -> enchants
tutorial:
  enabled: true
  start-delay-ticks: 160
  mine-blocks: 50
  reward-commands: ["crate givekey %player% common 3", "crate givekey %player% rare 1"]
  reward-text: "<gray>3x Common Key + 1x Rare Key"

first-join:
  enabled: true
  delay-ticks: 30
  # Starter items besides the pickaxe, Ore Bag and Colony Navigator (console commands, %player%)
  commands: ["crate givekey %player% common 1"]
  title: "<gradient:#55ffff:#aa55ff><bold>WELCOME</bold></gradient>"
  subtitle: "<gray>New here? Just ask in <white>chat</white> if you need help!"
  fade-in-ticks: 15
  stay-ticks: 100
  fade-out-ticks: 25
  chat:
    - ""
    - "<gradient:#55ffff:#aa55ff><bold>Welcome, {player}!</bold></gradient>"
    - "<gray>Follow the <light_purple>purple arrows</light_purple> to the mines, <gold>gold</gold> to the crates and <aqua>aqua</aqua> to the leaderboards."
    - "<gray>A short <aqua>tutorial</aqua> will show you the basics in a moment."
    - "<gray>Stuck? Ask in chat, someone will help you out."
    - ""

# When someone joins for the first time, everyone else can type /welcome to greet them and get a reward.
welcome-reward:
  enabled: true
  window-seconds: 60
  announce: "<aqua>{player}</aqua> <gray>joined for the first time! Type <yellow>/welcome</yellow> within {seconds}s for a free <light_purple>Rare Key</light_purple>."
  broadcast: "<aqua>{player}</aqua> <dark_gray>»</dark_gray> <white>Welcome to the server, <aqua>{newcomer}</aqua>!"
  rewarded: "<green>Thanks for welcoming {newcomer}! You got a <light_purple>Rare Key</light_purple>."
  nobody: "<red>There's no new player to welcome right now."
  self: "<red>You can't welcome yourself, but welcome anyway!"
  # Run from the console for each player who types /welcome. {player} = them, {newcomer} = the new player.
  commands:
    - "crate givekey {player} rare 1"

# Pickaxe tiers, bought with tokens from the enchant menu. Every tier mines at the same speed;
# a better tier raises how far the enchants under 'affects' can be levelled (cap % of their max level).
# Format: "MATERIAL | display name | token cost | cap % | requirement (optional: rank X / prestige N)".
# The first tier is the starting pickaxe. Maxing the pickaxe (Netherite) needs Prestige 1+.
pickaxe-tiers:
  enabled: true
  affects: [fortune, explosive, jackhammer, token-finder, key-finder, token-fortune, merchant]
  tiers:
    - "WOODEN_PICKAXE | <#c69c6d>Wooden | 0 | 15"
    - "STONE_PICKAXE | <gray>Stone | 50000 | 30 | rank E"
    - "IRON_PICKAXE | <white>Iron | 400000 | 45 | rank K"
    - "GOLDEN_PICKAXE | <gold>Gold | 2000000 | 60 | rank P"
    - "DIAMOND_PICKAXE | <aqua>Diamond | 8000000 | 80 | rank Z"
    - "NETHERITE_PICKAXE | <dark_purple>Netherite | 25000000 | 100 | prestige 1"

# Walk-in portals: stepping into the box (block coords, inclusive) runs 'command' as the player.
portals:
  mines-hall:
    world: spawn
    min: "-5,103,-50"
    max: "5,117,-50"
    push-back-to: "0,103,-46"
    push-back-yaw: 0
    command: "mine"

# Private mines (/pmine): every player can have their own mine island in this world.
# The block mix follows the owner's rank. Sizes are "width | token cost" (first = free starting size).
private-mines:
  enabled: true
  # true = /mine, /mines and the Mines Hall portal take players to their own private mine
  replace-public-mines: true
  world: pmines
  spacing: 200
  depth: 20
  reset-seconds: 300
  reset-percent: 0.75
  max-members: 5
  sizes:
    - "21 | 0"
    - "27 | 50000"
    - "33 | 200000"
    - "41 | 750000"
    - "51 | 2500000"

# Cores: the premium currency. /cores, /cores pay, /cores shop. Admin: /pa give|take|set cores <player> <amount>
cores:
  symbol: "<#3ab8ff>◉"
  # Icon for Cores in menus (custom head texture id)
  head: "b3ffe26b57f6afd20a07198ebff24a272abe6518c676af54b9321b09d13d6e63"
  # Core Shop entries: name, icon, amount, price (Cores), lore, commands run from console (%player%)
  shop:
    capsules:
      name: "<gradient:#7afcff:#b36bff><b>3x Pet Capsule</b></gradient>"
      icon: HEART_OF_THE_SEA
      head: "9aab01a5d9512e3175bf3af2edbfd59419dc5662605c42c91730e711254efcc4"
      amount: 3
      price: 150
      lore: ["<gray>Hatch random sci-fi pets."]
      commands: ["pa givepet %player% 3"]
    season-keys:
      name: "<gradient:#ff7af5:#7afcff><b>3x Season Key</b></gradient>"
      icon: AMETHYST_SHARD
      amount: 3
      price: 300
      lore: ["<gray>Season 1: Nebula Vanguard armor,", "<gray>pets, legendary keys and Cores."]
      commands: ["crate givekey %player% season 3"]
    legendary-keys:
      # Not sold: the Season Key is the premium key
      enabled: false
      name: "<gold><b>3x Legendary Key"
      icon: TRIPWIRE_HOOK
      amount: 3
      price: 250
      lore: ["<gray>Quantum Aegis armor, pets and more."]
      commands: ["crate givekey %player% legendary 3"]
    rare-keys:
      name: "<aqua><b>10x Rare Key"
      icon: TRIPWIRE_HOOK
      amount: 10
      price: 200
      lore: ["<gray>Plasma Weave armor, pet capsules."]
      commands: ["crate givekey %player% rare 10"]
    token-pack:
      name: "<yellow><b>1,000,000 Tokens"
      icon: SUNFLOWER
      price: 100
      lore: ["<gray>A big token boost."]
      commands: ["pa give tokens %player% 1000000"]

# Mining armor sets ("minesets"). Every piece rolls a quality 0-100; stats scale with it.
# quality = 100 * random^quality-curve  -> most pieces are low, 90+ is rare, 100 is very rare.
# stats (per piece at quality 100): fortune / token-gain / key-finder / proc-chance / token-finder are fractions (0.40 = +40%),
# sell is added to the sell multiplier (0.15 = +0.15x). set-bonus: wearing all 4 pieces, scaled by their average quality.
gear:
  quality-curve: 2.2
  # /wardrobe: store one full set of each type. A complete stored set gives
  # token-bonus x (average quality / 100) ^ quality-power  (0.75 = +75% tokens at 100% quality)
  wardrobe:
    title: "<dark_gray>Armor Wardrobe"
    quality-power: 1.5
    token-bonus: {scrap: 0.05, plasma: 0.15, quantum: 0.40, nebula: 0.75}
  broadcast-quality: 90
  sets:
    scrap:
      name: "<gray>Scrap Exo"
      flavor: "Salvaged hull plating, still humming."
      material: CHAINMAIL
      trim: {pattern: sentry, material: iron}
      armor-per-piece: 3
      stats: {fortune: 0.20, token-gain: 0.12, sell: 0.08}
      set-bonus: {fortune: 0.30, token-gain: 0.20}
    plasma:
      name: "<light_purple>Plasma Weave"
      flavor: "Woven from contained plasma filaments."
      material: LEATHER
      color: "#c13dff"
      trim: {pattern: flow, material: amethyst}
      armor-per-piece: 5
      stats: {fortune: 0.50, token-gain: 0.30, sell: 0.15, key-finder: 0.05}
      set-bonus: {fortune: 0.60, token-gain: 0.50, sell: 0.25}
    quantum:
      name: "<gradient:#7afcff:#3ab8ff>Quantum Aegis"
      flavor: "Phase-shifted alloy from a collapsed star."
      material: NETHERITE
      trim: {pattern: silence, material: diamond}
      armor-per-piece: 8
      stats: {fortune: 1.20, token-gain: 0.70, sell: 0.40, key-finder: 0.15, proc-chance: 0.08}
      set-bonus: {fortune: 1.50, token-gain: 1.20, sell: 0.60, proc-chance: 0.15}
    # Season 1 exclusive (Season Crate)
    nebula:
      name: "<gradient:#ff7af5:#7afcff>Nebula Vanguard"
      flavor: "Season 1 - forged in the heart of a nebula."
      material: NETHERITE
      trim: {pattern: spire, material: amethyst}
      armor-per-piece: 9
      stats: {fortune: 1.80, token-gain: 1.00, sell: 0.60, key-finder: 0.20, proc-chance: 0.12}
      set-bonus: {fortune: 2.20, token-gain: 1.80, sell: 0.90, proc-chance: 0.25}

# Gacha pets. Pet Capsules hatch a random type + rarity. Pets level 1-100 from mining.
# stat at a level = type per-level * level * rarity power.  XP to next level = xp-base * level^1.5 * rarity xp-mult
pets:
  xp-per-block: 1
  proc-xp-share: 0.05
  xp-base: 4
  max-level: 100
  max-owned: 45
  # extra pet storage areas players can buy (one per cost, max = number of costs). currency: tokens | money | cores
  storage-upgrades:
    size: 45
    currency: tokens
    costs: [100000000, 1000000000]
  show-follower: true
  broadcast-from-rarity-index: 4
  capsule:
    material: HEART_OF_THE_SEA
    # custom head texture (minecraft-heads.com "Value" or texture id); empty = use material
    head: "9aab01a5d9512e3175bf3af2edbfd59419dc5662605c42c91730e711254efcc4"
