# What ores drop when mined. "ITEM:amount" (Fortune multiplies this). Blocks not listed drop themselves.
ore-drops:
  COAL_ORE: "COAL"
  DEEPSLATE_COAL_ORE: "COAL:2"
  COPPER_ORE: "COPPER_INGOT:2"
  DEEPSLATE_COPPER_ORE: "COPPER_INGOT:3"
  IRON_ORE: "IRON_INGOT"
  DEEPSLATE_IRON_ORE: "IRON_INGOT:2"
  GOLD_ORE: "GOLD_INGOT"
  DEEPSLATE_GOLD_ORE: "GOLD_INGOT:2"
  NETHER_GOLD_ORE: "GOLD_INGOT:3"
  REDSTONE_ORE: "REDSTONE:4"
  DEEPSLATE_REDSTONE_ORE: "REDSTONE:6"
  LAPIS_ORE: "LAPIS_LAZULI:4"
  DEEPSLATE_LAPIS_ORE: "LAPIS_LAZULI:6"
  NETHER_QUARTZ_ORE: "QUARTZ"
  DIAMOND_ORE: "DIAMOND"
  DEEPSLATE_DIAMOND_ORE: "DIAMOND:2"
  EMERALD_ORE: "EMERALD"
  DEEPSLATE_EMERALD_ORE: "EMERALD:2"
  ANCIENT_DEBRIS: "NETHERITE_SCRAP"

# Condensing: every <amount> of one tier automatically turns into 1 of the next, in the inventory.
#   item (Coal) -> block (Coal Block) -> Enchanted Coal -> Enchanted Coal Block
# Each tier is worth amount x value-bonus x the tier below, so condensing never loses money.
# Players can also run /condense. Enchanted items can't be placed or crafted with.
condense:
  # Off: condensing let the inventory hold endless ore and made the Ore Bag pointless.
  # Enchanted items players already have still sell and can go in the bag.
  enabled: false
  amount: 64
  value-bonus: 1.0
  enchanted-name: "<aqua>Enchanted {item}"
  enchanted-block-name: "<light_purple>Enchanted {item}"
  # Removes vanilla 9-item block recipes (they would turn 9 coal into a block worth 64)
  disable-vanilla-block-recipes: true
  chains:
    coal: [COAL, COAL_BLOCK]
    copper: [COPPER_INGOT, COPPER_BLOCK]
    iron: [IRON_INGOT, IRON_BLOCK]
    gold: [GOLD_INGOT, GOLD_BLOCK]
    redstone: [REDSTONE, REDSTONE_BLOCK]
    lapis: [LAPIS_LAZULI, LAPIS_BLOCK]
    quartz: [QUARTZ, QUARTZ_BLOCK]
    diamond: [DIAMOND, DIAMOND_BLOCK]
    emerald: [EMERALD, EMERALD_BLOCK]
    amethyst: [AMETHYST_SHARD, AMETHYST_BLOCK]
    netherite: [NETHERITE_SCRAP, NETHERITE_BLOCK]

# Price per item when sold. Any block you put in a mine should have a price here.
