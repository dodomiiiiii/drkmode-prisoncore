# Ranks in order. 'cost' is the price to rank up INTO that rank.
# 'commands' run from console on rankup (%player% and %rank% are replaced), e.g. LuckPerms groups:
#   commands: ["lp user %player% parent add rank_%rank%"]
# Sell multiplier added per rank. The first rank (A) gets nothing; B = +0.02, C = +0.04 ... Z = +0.50
sell-multiplier-per-rank: 0.02

