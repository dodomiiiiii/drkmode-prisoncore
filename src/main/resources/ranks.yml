prestige:
  max: 100
  # Cost of the first prestige (needs last rank).
  cost: 20000000000
  # Every prestige multiplies ALL rankup costs and the next prestige cost by this (4 = x4, x16, x64...)
  cost-multiplier-per-prestige: 4
  # ...and that multiplier grows every prestige, so each one is harder than the last:
  # P1 x4, P2 x4.5, P3 x5, P4 x5.5 ... up to cost-multiplier-max per prestige (0 = growth off, flat x4).
  cost-multiplier-growth: 0.5
  cost-multiplier-max: 10
  # ...and multiplies the whole sell multiplier by this (2 = x2, x4, x8...). Net: each prestige is ~2x harder.
  sell-multiplier-per-prestige: 2
  # Old linear drops (only used when drop-multiplier-per-prestige is 0): 1 + 0.5 x prestige.
  fortune-per-prestige: 0.5
  # Every prestige multiplies ALL block drops by this, compounding: x1.5, x2.25, x3.4, x5.1 ... P7 x17, P10 x58.
  # Drops grow faster than the Ore Bag, so bags must keep being upgraded. (0 = use fortune-per-prestige instead)
  drop-multiplier-per-prestige: 1.5
  # Optional: linear sell factor instead of sell-multiplier-per-prestige (0 = off, sell stays x2 per prestige).
  sell-linear-per-prestige: 0
  # Prestige Points awarded for reaching prestige N: base + increase-per-prestige * (N - 1)  -> 10, 15, 20, 25...
  points:
    base: 10
    increase-per-prestige: 5
  # Old linear settings (only used if the multipliers above are 0)
  cost-increase-per-prestige: 0.25
  rank-cost-increase-per-prestige: 0.10
  sell-bonus-per-prestige: 0
  token-bonus-per-prestige: 0.02
  reset-money: true
  broadcast: true
  tag: "<dark_gray>[<light_purple>P{prestige}</light_purple>]</dark_gray> "
  # Console commands on prestige (%player%, %prestige%)
  commands: []
